name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

# Tidak ada permission di level workflow. Tiap job meminta sendiri
# sesuai kebutuhannya (least privilege).
permissions: {}

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Gate mutu: wajib hijau sebelum deploy boleh jalan ─────────────
  # Menguji logika skoring terhadap Juknis Kemenkes dan kontrak posisi
  # jawaban terhadap db/simpan_skrining.sql. Lihat tests/.
  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        # actions/checkout v7.0.1 — dipin ke SHA agar tag tidak bisa
        # dialihkan ke kode lain di kemudian hari.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node.js
        # actions/setup-node v7.0.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm

      # npm ci, BUKAN npm install: memakai package-lock.json apa adanya
      # sehingga build dapat direproduksi dan dependensi tidak berubah
      # diam-diam di antara dua kali deploy.
      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  # ── Build & deploy: hanya jalan setelah test hijau ────────────────
  build-and-deploy:
    name: Build & Deploy
    needs: test
    # Deploy hanya pada push ke branch utama, bukan pada pull request.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write # diperlukan untuk push ke branch gh-pages
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Catatan: variabel VITE_* di-inline ke dalam bundle JavaScript
      # dan dapat dibaca siapa pun dari browser. GitHub Secrets di sini
      # hanya menjaga nilai tersebut keluar dari source tree, BUKAN
      # menjadikannya rahasia. JANGAN pernah menaruh service_role key
      # atau kredensial sensitif di belakang prefix VITE_.
      - name: Build project
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON: ${{ secrets.VITE_SUPABASE_ANON }}
          VITE_BASE_PATH: "/new2026-v1/"
        run: npm run build

      - name: Deploy to GitHub Pages
        # peaceiris/actions-gh-pages v4.1.0 — dipin ke SHA. Action pihak
        # ketiga ini menerima GITHUB_TOKEN dengan izin tulis, jadi tag
        # yang dapat berubah (@v3/@v4) adalah risiko supply chain.
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
